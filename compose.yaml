services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: flowsync
      POSTGRES_PASSWORD: flowsync
      POSTGRES_DB: flowsync
    ports:
      - '54410:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    # Por TCP a propósito: en el primer arranque la imagen inicializa la base
    # con un servidor temporal que solo escucha en el socket Unix, así que una
    # comprobación por socket daría «sano» antes de que acepte conexiones.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U flowsync -d flowsync']
      interval: 2s
      timeout: 5s
      retries: 30

  db-test:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: flowsync
      POSTGRES_PASSWORD: flowsync
      POSTGRES_DB: flowsync_test
    ports:
      - '54411:5432'
    # La imagen declara un VOLUME en esta ruta: sin el tmpfs, Docker montaría un
    # volumen anónimo que sobrevive a que se recree el contenedor.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U flowsync -d flowsync_test']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  db-data:
