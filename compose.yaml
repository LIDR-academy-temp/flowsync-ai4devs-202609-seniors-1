# Bases de datos de FlowSync: PostgreSQL en Docker, una para desarrollo y otra
# para pruebas. Puertos 54410/54411 (no el 5432, para no chocar con un
# PostgreSQL local). Sin `version:`, que está obsoleta.

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: flowsync
      POSTGRES_PASSWORD: flowsync
      POSTGRES_DB: flowsync
    ports:
      - '54410:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Contra la base real y por TCP: `pg_isready` por socket daría verde
      # durante el servidor temporal del primer arranque, que no acepta
      # conexiones de red.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U flowsync -d flowsync']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  db-test:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: flowsync
      POSTGRES_PASSWORD: flowsync
      POSTGRES_DB: flowsync_test
    ports:
      - '54411:5432'
    # En memoria y sin volumen: efímera a propósito. La ruta es exactamente la
    # del VOLUME que declara la imagen; con otra (p. ej. `/var/lib/postgresql`)
    # Docker crea igualmente un volumen anónimo y los datos sobreviven.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U flowsync -d flowsync_test']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  db-data:
